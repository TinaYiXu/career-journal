<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职日志</title>
<style>
/* SECTION: reset */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;font-size:14px;line-height:1.5;color:#1e293b;background:#f1f5f9;-webkit-tap-highlight-color:transparent}
body{display:flex;min-height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;font-size:16px;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;outline:none;width:100%;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{resize:vertical;min-height:60px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* SECTION: sidebar */
#sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:fixed;left:0;top:0;z-index:100}
.sidebar-brand{padding:20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px}
.sidebar-brand svg{width:28px;height:28px;color:#3b82f6;flex-shrink:0}
.sidebar-brand span{font-size:16px;font-weight:700;color:#1e293b}
.sidebar-nav{flex:1;padding:12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;color:#64748b;cursor:pointer;transition:all .2s;margin-bottom:4px;min-height:44px}
.nav-item:hover{background:#f1f5f9;color:#1e293b}
.nav-item.active{background:#eff6ff;color:#3b82f6}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.sidebar-footer{padding:16px 20px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8}

/* SECTION: main */
#main{flex:1;margin-left:220px;height:100vh;overflow-y:auto;padding:24px}
.view{display:none}.view.active{display:block}
.view-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.view-header h2{font-size:20px;font-weight:700}
.btn-primary{background:#3b82f6;color:#fff;padding:8px 18px;border-radius:8px;font-weight:600;font-size:13px;transition:background .2s;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{background:#2563eb}
.btn-secondary{background:#f1f5f9;color:#475569;padding:8px 18px;border-radius:8px;font-weight:500;font-size:13px;transition:all .2s;min-height:40px;display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e8f0}
.btn-secondary:hover{background:#e2e8f0}
.btn-secondary.active{background:#eff6ff;color:#3b82f6;border-color:#3b82f6}
.btn-danger{background:#fee2e2;color:#dc2626;padding:6px 14px;border-radius:8px;font-weight:500;font-size:13px}
.btn-danger:hover{background:#fecaca}

/* SECTION: stats */
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#fff;border-radius:12px;padding:16px 20px;flex:1;min-width:120px;border:1px solid #e2e8f0}
.stat-card .stat-label{font-size:12px;color:#64748b;font-weight:500;margin-bottom:4px}
.stat-card .stat-value{font-size:24px;font-weight:700;color:#1e293b}
.stat-card .stat-sub{font-size:12px;color:#94a3b8;margin-top:2px}

/* SECTION: kanban */
.kanban-toggle{display:flex;gap:8px;margin-bottom:16px}
.kanban-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;min-height:300px}
.kanban-column{background:#f8fafc;border-radius:12px;min-width:220px;flex:1;display:flex;flex-direction:column;border:1px solid #e2e8f0}
.kanban-column.drag-over{background:#eff6ff;border-color:#93c5fd}
.column-header{padding:14px 16px;font-weight:600;font-size:13px;color:#475569;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.column-header .col-count{background:#e2e8f0;color:#475569;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.column-cards{flex:1;padding:8px;overflow-y:auto;min-height:60px}
.app-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:8px;border:1px solid #e2e8f0;cursor:grab;transition:all .2s;position:relative}
.app-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:#cbd5e1}
.app-card.dragging{opacity:.5;transform:rotate(2deg)}
.app-card.stagnant{border-left:3px solid #f59e0b}
.app-card .card-company{font-weight:700;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.app-card .card-position{font-size:13px;color:#64748b;margin-bottom:8px}
.app-card .card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
.card-tag{padding:2px 8px;border-radius:6px;font-weight:500}
.card-tag.city{background:#f0fdf4;color:#16a34a}
.card-tag.channel{background:#fefce8;color:#ca8a04}
.card-tag.date{background:#f1f5f9;color:#64748b}
.card-tag.stagnant-tag{background:#fef3c7;color:#d97706}
.card-next{margin-top:8px;font-size:12px;color:#3b82f6;font-weight:500;padding:4px 0}
.card-actions{display:flex;gap:6px;margin-top:8px}
.card-actions button{font-size:11px;padding:4px 10px;border-radius:6px;min-height:28px}
.stagnant-badge{position:absolute;top:8px;right:8px;font-size:10px;background:#fef3c7;color:#d97706;padding:2px 6px;border-radius:4px;font-weight:600}

/* SECTION: calendar */
.calendar-container{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden}
.calendar-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.calendar-header h3{font-size:16px;font-weight:600}
.calendar-nav{display:flex;gap:8px}
.calendar-nav button{width:36px;height:36px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:18px}
.calendar-nav button:hover{background:#e2e8f0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #e2e8f0}
.cal-day-header{padding:10px 4px;text-align:center;font-size:12px;font-weight:600;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.cal-day{padding:8px 4px;min-height:80px;border-right:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;position:relative;font-size:12px}
.cal-day:nth-child(7n){border-right:none}
.cal-day .day-num{font-weight:600;color:#475569;margin-bottom:4px;font-size:13px}
.cal-day.other-month .day-num{color:#cbd5e1}
.cal-day.today .day-num{background:#3b82f6;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-event{padding:2px 4px;border-radius:4px;margin-bottom:2px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-event.interview{background:#dbeafe;color:#1d4ed8}
.cal-event.test{background:#fef3c7;color:#d97706}
.cal-event.conflict{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}

/* SECTION: review */
.review-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.review-filters select{width:auto;min-width:120px}
.review-filters input{width:auto;min-width:120px}
.review-list{display:flex;flex-direction:column;gap:12px}
.review-card{background:#fff;border-radius:12px;padding:20px;border:1px solid #e2e8f0}
.review-card .review-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.review-card .review-company{font-weight:700;font-size:15px}
.review-card .review-round{font-size:12px;color:#3b82f6;font-weight:600;background:#eff6ff;padding:2px 8px;border-radius:6px}
.review-card .review-date{font-size:12px;color:#94a3b8}
.review-section{margin-top:10px}
.review-section .label{font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px}
.review-section .content{font-size:13px;color:#334155;line-height:1.6}
.review-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.review-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:#64748b}
.review-tag.professional{background:#dbeafe;color:#1d4ed8}
.review-tag.behavioral{background:#dcfce7;color:#16a34a}
.review-tag.case{background:#fef3c7;color:#d97706}
.empty-state{text-align:center;padding:40px 20px;color:#94a3b8}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;color:#cbd5e1}
.empty-state p{font-size:14px}

/* SECTION: offer */
.offer-controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.offer-table-wrap{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow-x:auto}
.offer-table{width:100%;border-collapse:collapse;font-size:13px}
.offer-table th{background:#f8fafc;padding:12px 14px;text-align:left;font-weight:600;color:#475569;border-bottom:1px solid #e2e8f0;white-space:nowrap;font-size:12px}
.offer-table td{padding:12px 14px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.offer-table tr:hover{background:#f8fafc}
.offer-table .annual-pkg{font-weight:700;color:#1e293b;font-size:14px}
.offer-table .score-cell{font-weight:600}
.weight-panel{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px;margin-top:16px}
.weight-panel h4{font-size:14px;font-weight:600;margin-bottom:14px}
.weight-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px}
.weight-row label{min-width:80px;font-weight:500;color:#475569}
.weight-row input[type=range]{flex:1;-webkit-appearance:none;height:6px;background:#e2e8f0;border-radius:3px;border:none;padding:0}
.weight-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#3b82f6;cursor:pointer}
.weight-row .weight-val{min-width:30px;text-align:right;font-weight:600;color:#3b82f6}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;color:#fff}
.rank-1{background:#f59e0b}.rank-2{background:#94a3b8}.rank-3{background:#b45309}

/* SECTION: modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
#modal-overlay.open{display:flex}
#modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:24px}
#modal h3{font-size:18px;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px}
.form-group .form-row{display:flex;gap:12px}
.form-group .form-row>div{flex:1}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0}
.form-hint{font-size:11px;color:#94a3b8;margin-top:4px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:18px}

/* SECTION: responsive */
@media(max-width:768px){
  #sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:64px;flex-direction:row;border-right:none;border-top:1px solid #e2e8f0;z-index:100}
  .sidebar-brand,.sidebar-footer{display:none}
  .sidebar-nav{display:flex;flex-direction:row;padding:0 8px;gap:4px;width:100%;justify-content:space-around;align-items:center}
  .nav-item{flex-direction:column;gap:2px;font-size:10px;padding:6px 12px;margin:0;min-height:auto;flex:1;justify-content:center;text-align:center}
  .nav-item svg{width:22px;height:22px}
  #main{margin-left:0;padding:16px 12px 80px;height:calc(100vh - 0px)}
  .stats-row{gap:8px}
  .stat-card{min-width:80px;padding:12px}
  .stat-card .stat-value{font-size:20px}
  .kanban-board{gap:10px}
  .kanban-column{min-width:260px}
  .cal-day{min-height:60px;padding:4px 2px}
  .cal-event{font-size:9px}
  .offer-table{font-size:12px}
  .offer-table th,.offer-table td{padding:8px 10px}
  #modal{padding:16px;max-height:90vh;border-radius:12px}
}
@media(max-width:480px){
  .stats-row{flex-direction:column}
  .stat-card{min-width:auto}
  .view-header{flex-direction:column;align-items:flex-start}
}
.data-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.data-tools small{color:#64748b}
#save-notice{position:fixed;top:16px;right:16px;z-index:2000;max-width:calc(100vw - 32px);padding:12px 18px;border-radius:10px;color:#166534;background:#dcfce7;border:1px solid #86efac;box-shadow:0 4px 16px #0002}
#save-notice.error{color:#991b1b;background:#fee2e2;border-color:#fca5a5}
</style>
</head>
<body>

<!-- SECTION: sidebar -->
<nav id="sidebar">
  <div class="sidebar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
    <span>求职日志</span>
  </div>
  <div class="sidebar-nav">
    <div class="nav-item active" data-view="delivery" onclick="switchView('delivery')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>投递追踪</span>
    </div>
    <div class="nav-item" data-view="review" onclick="switchView('review')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>面试复盘</span>
    </div>
    <div class="nav-item" data-view="offer" onclick="switchView('offer')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
      <span>Offer对比</span>
    </div>
  </div>
  <div class="sidebar-footer">数据存储于本地浏览器</div>
</nav>

<!-- SECTION: main -->
<div id="save-notice" role="status" aria-live="polite" hidden></div>
<div id="main">
  <div class="data-tools">
    <button class="btn-secondary" onclick="exportBackup()">导出备份</button>
    <button class="btn-secondary" onclick="document.getElementById('backup-file').click()">导入备份</button>
    <button class="btn-secondary" id="undo-delete" onclick="undoDelete()" disabled>撤销删除</button>
    <input id="backup-file" type="file" accept=".json,application/json" hidden onchange="importBackup(this)">
    <small>建议定期导出备份；撤销仅适用于本次打开期间的删除。</small>
  </div>

  <!-- SECTION: delivery-view -->
  <div id="view-delivery" class="view active">
    <div class="stats-row" id="stats-bar"></div>
    <div class="view-header">
      <div class="kanban-toggle">
        <button class="btn-secondary active" data-primary-action id="btn-kanban" onclick="switchSubView('kanban')">看板视图</button>
        <button class="btn-secondary" id="btn-calendar" onclick="switchSubView('calendar')">日历视图</button>
      </div>
      <button class="btn-primary" data-primary-action onclick="openAppModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建投递
      </button>
    </div>
    <div id="kanban-container" class="kanban-board"></div>
    <div id="calendar-container" class="calendar-container" style="display:none"></div>
  </div>

  <!-- SECTION: review-view -->
  <div id="view-review" class="view">
    <div class="view-header">
      <h2>面试复盘</h2>
      <button class="btn-primary" data-primary-action onclick="openReviewModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建复盘
      </button>
    </div>
    <div class="review-filters" id="review-filters"></div>
    <div id="review-list" class="review-list"></div>
  </div>

  <!-- SECTION: offer-view -->
  <div id="view-offer" class="view">
    <div class="view-header">
      <h2>Offer对比</h2>
      <button class="btn-primary" data-primary-action onclick="openOfferModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加Offer
      </button>
    </div>
    <div class="offer-table-wrap" id="offer-table-wrap"></div>
    <div class="weight-panel" id="weight-panel"></div>
  </div>
</div>

<!-- SECTION: modal -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal" style="position:relative"></div>
</div>

<script>
/* SECTION: constants */
var STAGES=['applied','test','first','second','hr','offer','rejected'];
var STAGE_LABELS={applied:'已投递',test:'测评/笔试',first:'一面',second:'二面',hr:'HR面',offer:'Offer',rejected:'未通过/无后续'};

/* SECTION: state */
var state={applications:[],reviews:[],offers:[],weights:{salary:3,housing:2,intensity:2,growth:3}};

/* SECTION: mock-data */
function initMockData(){

    {id:'a1',company:'A银行',position:'总行管培生',city:'上海',channel:'官网',applyDate:'2026-10-05',stage:'first',nextStep:'等待一面结果',notes:'笔试已通过',url:'https://career.abank.com.cn',events:[]},
    {id:'a2',company:'B咨询',position:'初级顾问',city:'北京',channel:'内推',applyDate:'2026-10-08',stage:'second',nextStep:'准备案例面试',notes:'合伙人推荐',url:'https://www.bconsulting.com/careers',events:[{date:'2026-10-28',type:'interview',label:'二面 14:00'}]},

    {id:'a4',company:'D科技',position:'产品经理',city:'深圳',channel:'官网',applyDate:'2026-10-10',stage:'applied',nextStep:'等待简历筛选',notes:'',url:'https://careers.dtech.com',events:[]},

/* SECTION: storage */
var noticeTimer,deleteHistory=[],lastSaved=null,storageReadFailed=false;
function notifySave(message,error){
  var el=document.getElementById('save-notice');clearTimeout(noticeTimer);el.textContent=message;
  el.className=error?'error':'';el.setAttribute('role',error?'alert':'status');el.hidden=false;
  if(!error)noticeTimer=setTimeout(function(){el.hidden=true},3500);
}
function saveData(message){
  try{if(storageReadFailed)throw Error('读取异常');var serialized=JSON.stringify(state);localStorage.setItem(STORAGE_KEY,serialized);lastSaved=serialized;notifySave(message||'保存成功',false);return true}
  catch(e){if(lastSaved!==null)state=JSON.parse(lastSaved);notifySave('保存失败：存储不可用、空间不足或原数据读取异常。请导出备份并检查浏览器设置。',true);return false}
}
function loadData(){
  try{var d=localStorage.getItem(STORAGE_KEY);if(d!==null){state=validateBackup(JSON.parse(d));lastSaved=JSON.stringify(state);return true}}
  catch(e){storageReadFailed=true;notifySave('读取失败：原数据未覆盖，请保留原数据并尝试导入有效备份。',true);return 'error'}
  return false;
}
function refreshViews(){renderDelivery();renderReviews();renderOffers()}
function updateUndo(){document.getElementById('undo-delete').disabled=!deleteHistory.length}
function deleteRecords(kind,id){
  var previous=JSON.parse(JSON.stringify(state)),removed={};
  ['applications','reviews','offers'].forEach(function(key){
    removed[key]=[];state[key]=state[key].filter(function(row,index){
      var match=key===kind&&row.id===id||kind==='applications'&&key!=='applications'&&row.applicationId===id;
      if(match)removed[key].push({index:index,row:row});return !match;
    });
  });
  if(!saveData('删除已保存，可点击“撤销删除”恢复')){state=previous;refreshViews();return}
  deleteHistory.push(removed);updateUndo();refreshViews();
}
function undoDelete(){
  if(!deleteHistory.length)return;
  var previous=JSON.parse(JSON.stringify(state)),removed=deleteHistory[deleteHistory.length-1];
  ['applications','reviews','offers'].forEach(function(key){removed[key].forEach(function(item){
    if(!state[key].some(function(row){return row.id===item.row.id}))state[key].splice(Math.min(item.index,state[key].length),0,item.row);
  })});
  if(!saveData('撤销成功，记录已恢复并保存')){state=previous;return}
  deleteHistory.pop();updateUndo();refreshViews();
}
function validateBackup(data){
  if(!data||typeof data!=='object')throw Error('备份格式无效');
  if(Object.prototype.hasOwnProperty.call(data,'version')){
    if(data.version!==1||data.app!=='career-workbench')throw Error('不支持此备份版本');data=data.data;
  }
  if(!data||!data.weights||['salary','housing','intensity','growth'].some(function(k){return !Number.isFinite(data.weights[k])||data.weights[k]<0||data.weights[k]>5}))throw Error('权重无效');
  var fields={applications:['company','position','city','channel','applyDate','stage','nextStep','notes'],reviews:['applicationId','round','date','questions','answers','improvements'],offers:['applicationId','company','position','city']};
  Object.keys(fields).forEach(function(key){
    if(!Array.isArray(data[key]))throw Error('缺少记录列表');
    var ids=new Set();data[key].forEach(function(row){
      if(!row||typeof row.id!=='string'||!row.id||ids.has(row.id)||fields[key].some(function(k){return typeof row[k]!=='string'}))throw Error('记录无效或编号重复');ids.add(row.id);
      if(key==='applications'&&(STAGES.indexOf(row.stage)<0||!Array.isArray(row.events)||row.events.some(function(e){return !e||['date','type','label'].some(function(k){return typeof e[k]!=='string'})})))throw Error('投递记录无效');
      if(key==='reviews'&&(!Array.isArray(row.questionTypes)||row.questionTypes.some(function(t){return QUESTION_TYPES.indexOf(t)<0})))throw Error('题型无效');
      if(key==='offers'&&['monthlySalary','months','housingRatio','intensity','growth'].some(function(k){return !Number.isFinite(row[k])||row[k]<0}))throw Error('Offer 数值无效');
    });
  });
  var ids=new Set(data.applications.map(function(a){return a.id}));
  if(data.reviews.concat(data.offers).some(function(r){return !ids.has(r.applicationId)}))throw Error('关联投递不存在');
  return JSON.parse(JSON.stringify(data));
}
function exportBackup(){
  try{
    var blob=new Blob([JSON.stringify({app:'career-workbench',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='求职日志备份-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);notifySave('备份下载已发起，请确认文件已保存。',false);
  }catch(e){notifySave('导出失败：'+e.message,true)}
}
async function importBackup(input){
  var file=input.files[0];input.value='';if(!file)return;
  try{
    if(file.size>10*1024*1024)throw Error('文件超过 10 MB');
    var next=validateBackup(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));
    if(!confirm('导入将替换全部数据（'+next.applications.length+' 条投递、'+next.reviews.length+' 条复盘、'+next.offers.length+' 条 Offer）。建议先导出当前备份。是否继续？'))return;
    var previous=state,previousReadFailed=storageReadFailed;state=next;storageReadFailed=false;
    if(!saveData('导入成功，数据已保存')){state=previous;storageReadFailed=previousReadFailed;return}
    deleteHistory=[];updateUndo();refreshViews();
  }catch(e){notifySave('导入失败：'+e.message+'。当前数据未替换。',true)}
}

/* SECTION: render-calendar */
var calYear=2026,calMonth=9;
function renderCalendar(){
  var container=document.getElementById('calendar-container');
  container.innerHTML='';
  var header=document.createElement('div');header.className='calendar-header';
  var title=document.createElement('h3');title.textContent=calYear+'年'+MONTHS[calMonth];
  var nav=document.createElement('div');nav.className='calendar-nav';
  var prevBtn=document.createElement('button');prevBtn.textContent='‹';
  prevBtn.addEventListener('click',function(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendar()});
  var nextBtn=document.createElement('button');nextBtn.textContent='›';
  nextBtn.addEventListener('click',function(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendar()});
  nav.appendChild(prevBtn);nav.appendChild(nextBtn);
  header.appendChild(title);header.appendChild(nav);container.appendChild(header);
  var grid=document.createElement('div');grid.className='calendar-grid';
  WEEKDAYS.forEach(function(d){var dh=document.createElement('div');dh.className='cal-day-header';dh.textContent=d;grid.appendChild(dh)});
  var firstDay=new Date(calYear,calMonth,1);
  var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  var startDow=(firstDay.getDay()+6)%7;
  var prevMonthDays=new Date(calYear,calMonth,0).getDate();
  var today=new Date();
  var allEvents=[];
  state.applications.forEach(function(app){
    if(app.events){app.events.forEach(function(ev){allEvents.push({date:ev.date,type:ev.type,label:ev.label,company:app.company})})}
  });
  for(var i=0;i<42;i++){
    var dayEl=document.createElement('div');dayEl.className='cal-day';
    var dayNum,dateStr,isOther=false;
    if(i<startDow){dayNum=prevMonthDays-startDow+1+i;var pm=calMonth===0?11:calMonth-1;var py=calMonth===0?calYear-1:calYear;dateStr=py+'-'+String(pm+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');isOther=true}
    else if(i-startDow>=daysInMonth){dayNum=i-startDow-daysInMonth+1;var nm=calMonth===11?0:calMonth+1;var ny=calMonth===11?calYear+1:calYear;dateStr=ny+'-'+String(nm+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');isOther=true}
    else{dayNum=i-startDow+1;dateStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0')}
    if(isOther)dayEl.classList.add('other-month');
    if(!isOther&&today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===dayNum)dayEl.classList.add('today');
    var numEl=document.createElement('div');numEl.className='day-num';numEl.textContent=dayNum;dayEl.appendChild(numEl);
    var dayEvents=allEvents.filter(function(e){return e.date===dateStr});
    if(dayEvents.length>=2){dayEvents.forEach(function(e){e.hasConflict=true})}
    dayEvents.forEach(function(ev){
      var evEl=document.createElement('div');evEl.className='cal-event '+ev.type;
      if(ev.hasConflict)evEl.classList.add('conflict');
      evEl.textContent=ev.company+' '+ev.label;dayEl.appendChild(evEl);
    });
    grid.appendChild(dayEl);
  }
  container.appendChild(grid);
}

    var rd=document.createElement('span');rd.className='review-round';rd.textContent=rev.round;hdr.appendChild(rd);
    card.appendChild(hdr);
    if(rev.questions){var s1=document.createElement('div');s1.className='review-section';var l1=document.createElement('div');l1.className='label';l1.textContent='被问到的问题';var c1=document.createElement('div');c1.className='content';c1.textContent=rev.questions;s1.appendChild(l1);s1.appendChild(c1);card.appendChild(s1)}
    if(rev.answers){var s2=document.createElement('div');s2.className='review-section';var l2=document.createElement('div');l2.className='label';l2.textContent='回答要点';var c2=document.createElement('div');c2.className='content';c2.textContent=rev.answers;s2.appendChild(l2);s2.appendChild(c2);card.appendChild(s2)}
    if(rev.improvements){var s3=document.createElement('div');s3.className='review-section';var l3=document.createElement('div');l3.className='label';l3.textContent='没答好的地方';var c3=document.createElement('div');c3.className='content';c3.textContent=rev.improvements;s3.appendChild(l3);s3.appendChild(c3);card.appendChild(s3)}
    if(rev.questionTypes&&rev.questionTypes.length>0){var tags=document.createElement('div');tags.className='review-tags';rev.questionTypes.forEach(function(t){var tag=document.createElement('span');tag.className='review-tag '+t;tag.textContent=QUESTION_TYPE_LABELS[t]||t;tags.appendChild(tag)});card.appendChild(tags)}
    var delRow=document.createElement('div');delRow.style.cssText='margin-top:10px;text-align:right';
    var delBtn=document.createElement('button');delBtn.className='btn-danger';delBtn.textContent='删除';
    delBtn.addEventListener('click',function(){deleteRecords('reviews',rev.id)});
    delRow.appendChild(delBtn);card.appendChild(delRow);
    listEl.appendChild(card);
  });
}

/* SECTION: render-offers */
function renderOffers(){
  var wrap=document.getElementById('offer-table-wrap');
  wrap.innerHTML='';
  if(state.offers.length===0){wrap.innerHTML='<div class="empty-state"><p>暂无Offer记录，点击上方按钮添加</p></div>';renderWeightPanel();return}
  var table=document.createElement('table');table.className='offer-table';
  var thead=document.createElement('thead');var hr=document.createElement('tr');
  ['排名','公司','岗位','城市','月薪','月数','公积金','年包','强度','成长','综合分'].forEach(function(h){var th=document.createElement('th');th.textContent=h;hr.appendChild(th)});
  thead.appendChild(hr);table.appendChild(thead);
  var w=state.weights;var wTotal=w.salary+w.housing+w.intensity+w.growth;if(wTotal===0)wTotal=1;
  var maxSalary=0;state.offers.forEach(function(o){var a=calcAnnual(o);if(a>maxSalary)maxSalary=a});
  var scored=state.offers.map(function(o){
    var annual=calcAnnual(o);
    var salScore=maxSalary>0?(annual/maxSalary)*5:0;
    var houScore=o.housingRatio*30;
    var intScore=(6-o.intensity);
    var groScore=o.growth;
    var ws=(salScore*w.salary+houScore*w.housing+intScore*w.intensity+groScore*w.growth)/wTotal;
    return{offer:o,annual:annual,weightedScore:ws};
  });
  scored.sort(function(a,b){return b.weightedScore-a.weightedScore});
  var tbody=document.createElement('tbody');
  scored.forEach(function(item,idx){
    var o=item.offer;
    var tr=document.createElement('tr');
    var rankTd=document.createElement('td');
    if(idx<3){var rb=document.createElement('span');rb.className='rank-badge rank-'+(idx+1);rb.textContent=idx+1;rankTd.appendChild(rb)}else{rankTd.textContent=idx+1}
    tr.appendChild(rankTd);
    var tdCo=document.createElement('td');tdCo.style.fontWeight='600';tdCo.textContent=o.company;tr.appendChild(tdCo);
    var tdPo=document.createElement('td');tdPo.textContent=o.position;tr.appendChild(tdPo);
    var tdCi=document.createElement('td');tdCi.textContent=o.city;tr.appendChild(tdCi);
    var tdSa=document.createElement('td');tdSa.textContent=o.monthlySalary.toLocaleString();tr.appendChild(tdSa);
    var tdMo=document.createElement('td');tdMo.textContent=o.months;tr.appendChild(tdMo);
    var tdHo=document.createElement('td');tdHo.textContent=Math.round(o.housingRatio*100)+'%';tr.appendChild(tdHo);
    var tdAn=document.createElement('td');tdAn.className='annual-pkg';tdAn.textContent=item.annual.toLocaleString();tr.appendChild(tdAn);
    var tdIn=document.createElement('td');tdIn.textContent=o.intensity+'/5';tr.appendChild(tdIn);
    var tdGr=document.createElement('td');tdGr.textContent=o.growth+'/5';tr.appendChild(tdGr);
    var tdSc=document.createElement('td');tdSc.className='score-cell';tdSc.textContent=item.weightedScore.toFixed(1);tdSc.style.color='#3b82f6';tr.appendChild(tdSc);
    var tdDel=document.createElement('td');var delBtn=document.createElement('button');delBtn.className='btn-danger';delBtn.textContent='删除';
    delBtn.addEventListener('click',function(){deleteRecords('offers',o.id)});
    tdDel.appendChild(delBtn);tr.appendChild(tdDel);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);wrap.appendChild(table);
  renderWeightPanel();
}
function renderWeightPanel(){
  var panel=document.getElementById('weight-panel');
  panel.innerHTML='';
  var h4=document.createElement('h4');h4.textContent='权重设置（拖动滑块调整各项重要性）';panel.appendChild(h4);
  var items=[{key:'salary',label:'年薪待遇'},{key:'housing',label:'公积金比例'},{key:'intensity',label:'工作强度'},{key:'growth',label:'成长空间'}];
  items.forEach(function(item){
    var row=document.createElement('div');row.className='weight-row';
    var lb=document.createElement('label');lb.textContent=item.label;row.appendChild(lb);
    var slider=document.createElement('input');slider.type='range';slider.min='0';slider.max='5';slider.step='1';slider.value=state.weights[item.key];
    var valEl=document.createElement('span');valEl.className='weight-val';valEl.textContent=state.weights[item.key];
    slider.addEventListener('input',function(){state.weights[item.key]=parseInt(this.value);valEl.textContent=this.value;saveData();renderOffers()});
    row.appendChild(slider);row.appendChild(valEl);panel.appendChild(row);
  });
}

  overlay.classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open')}

  var html='<h3>'+(app?'编辑投递':'新建投递')+'</h3>'
    +'<div class="form-group"><label>公司名称</label><input id="f-company" value="'+(app?app.company:'')+'" placeholder="如：A银行"></div>'
    +'<div class="form-group"><div class="form-row"><div><label>岗位</label><input id="f-position" value="'+(app?app.position:'')+'" placeholder="如：产品经理"></div>'
    +'<div><label>城市</label><input id="f-city" value="'+(app?app.city:'')+'" placeholder="如：上海"></div></div></div>'
    +'<div class="form-group"><div class="form-row"><div><label>投递渠道</label><select id="f-channel">'+channelOpts+'</select></div>'
    +'<div><label>投递日期</label><input type="date" id="f-date" value="'+(app?app.applyDate:'')+'"></div></div></div>'
    +'<div class="form-group"><label>投递网址</label><input id="f-url" type="url" value="'+(app&&app.url?app.url:'')+'" placeholder="如：https://career.example.com/job/123"></div>'
    +'<div class="form-group"><div class="form-row"><div><label>当前阶段</label><select id="f-stage">'+stageOpts+'</select></div>'
    +'<div><label>下一步</label><input id="f-next" value="'+(app?app.nextStep:'')+'" placeholder="如：等待面试通知"></div></div></div>'
    +'<div class="form-group"><label>备注</label><textarea id="f-notes" placeholder="补充信息...">'+(app?app.notes:'')+'</textarea></div>'
    +'<div class="form-actions"><button class="btn-secondary" onclick="closeModal()">取消</button>'
    +'<button class="btn-primary" onclick="saveApp(\''+(app?app.id:'')+'\')">保存</button></div>';
  openModal(html);
}
function saveApp(editId){
  var company=document.getElementById('f-company').value.trim();
  var position=document.getElementById('f-position').value.trim();
  var city=document.getElementById('f-city').value.trim();
  if(!company||!position){alert('请填写公司名称和岗位');return}
  var data={
    company:company,position:position,city:city,
    channel:document.getElementById('f-channel').value,
    applyDate:document.getElementById('f-date').value||new Date().toISOString().slice(0,10),
    stage:document.getElementById('f-stage').value,
    nextStep:document.getElementById('f-next').value.trim(),
    url:document.getElementById('f-url').value.trim(),
    notes:document.getElementById('f-notes').value.trim()
  };
  if(editId){
    var app=state.applications.find(function(a){return a.id===editId});
    if(app)Object.assign(app,data);
  }else{
    data.id=genId();data.events=[];
    state.applications.push(data);
  }
  if(!saveData())return;closeModal();renderDelivery();
}
function deleteApp(id){
  if(!confirm('确定删除这条投递记录？'))return;
  deleteRecords('applications',id);
}

function saveReview(){
  var appId=document.getElementById('f-appid').value;
  var round=document.getElementById('f-round').value.trim();
  if(!round){alert('请填写轮次');return}
  var types=[];
  document.querySelectorAll('.f-qtype:checked').forEach(function(cb){types.push(cb.value)});
  var rev={
    id:genId(),applicationId:appId,round:round,
    date:document.getElementById('f-rdate').value||new Date().toISOString().slice(0,10),
    questions:document.getElementById('f-questions').value.trim(),
    answers:document.getElementById('f-answers').value.trim(),
    improvements:document.getElementById('f-improve').value.trim(),
    questionTypes:types
  };
  state.reviews.push(rev);if(!saveData())return;closeModal();renderReviews();
}

function openOfferModal(){
  if(state.applications.length===0){alert('请先添加投递记录');return}
  var appOpts='';
  state.applications.forEach(function(a){appOpts+='<option value="'+a.id+'" data-company="'+a.company+'" data-position="'+a.position+'" data-city="'+a.city+'">'+a.company+' - '+a.position+'</option>'});
  var html='<h3>添加Offer</h3>'
    +'<div class="form-group"><label>关联投递</label><select id="f-off-appid" onchange="fillOfferInfo()">'+appOpts+'</select></div>'
    +'<div class="form-group"><div class="form-row"><div><label>公司</label><input id="f-off-company" readonly></div>'
    +'<div><label>岗位</label><input id="f-off-position" readonly></div></div></div>'
    +'<div class="form-group"><label>城市</label><input id="f-off-city" readonly></div>'
    +'<div class="form-group"><div class="form-row"><div><label>月薪（元）</label><input type="number" id="f-off-salary" placeholder="如：15000"></div>'
    +'<div><label>月数（含年终）</label><input type="number" id="f-off-months" value="12" placeholder="如：14"></div></div></div>'
    +'<div class="form-group"><div class="form-row"><div><label>公积金比例</label><input type="number" id="f-off-housing" step="0.01" value="0.12" placeholder="如：0.12"></div>'
    +'<div><label>工作强度 (1-5)</label><input type="number" id="f-off-intensity" min="1" max="5" value="3"></div></div></div>'
    +'<div class="form-group"><label>成长空间 (1-5)</label><input type="number" id="f-off-growth" min="1" max="5" value="3"></div>'
    +'<div class="form-actions"><button class="btn-secondary" onclick="closeModal()">取消</button>'
    +'<button class="btn-primary" onclick="saveOffer()">保存</button></div>';

function fillOfferInfo(){
  var sel=document.getElementById('f-off-appid');
  var opt=sel.options[sel.selectedIndex];
  if(opt){
    document.getElementById('f-off-company').value=opt.dataset.company||'';
    document.getElementById('f-off-position').value=opt.dataset.position||'';
    document.getElementById('f-off-city').value=opt.dataset.city||'';
  }
}
function saveOffer(){
  var salary=parseInt(document.getElementById('f-off-salary').value)||0;
  if(!salary){alert('请填写月薪');return}
  var offer={
    id:genId(),
    applicationId:document.getElementById('f-off-appid').value,
    company:document.getElementById('f-off-company').value,
    position:document.getElementById('f-off-position').value,
    city:document.getElementById('f-off-city').value,
    monthlySalary:salary,
    months:parseInt(document.getElementById('f-off-months').value)||12,
    housingRatio:parseFloat(document.getElementById('f-off-housing').value)||0.12,
    intensity:parseInt(document.getElementById('f-off-intensity').value)||3,
    growth:parseInt(document.getElementById('f-off-growth').value)||3
  };
  state.offers.push(offer);if(!saveData())return;closeModal();renderOffers();
}
